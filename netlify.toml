[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Google Analytics 4 (property "Vaishnavi Technologies"). Production only, so
# deploy previews don't add test visits to the reports. The ID is public: it
# appears in the page source of every site that uses Analytics.
[context.production.environment]
  VITE_GA_MEASUREMENT_ID = "G-QKKTV0W3FL"

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/project/:id"
  to = "/.netlify/functions/project-preview?id=:id"
  status = 200
  force = true

# Public pages get their own prerendered copy of index.html: the page's
# content plus its title and link-preview details (written by
# scripts/route-pages.mjs at build time). Keep in sync with PRERENDERED_PAGES
# in src/lib/pageMeta.js. The home page rule needs force = true because
# dist/index.html exists; index.html itself stays the empty app shell that
# the signed-in pages, 404s and project pages use.
[[redirects]]
  from = "/"
  to = "/route-pages/home.html"
  status = 200
  force = true

[[redirects]]
  from = "/catalog"
  to = "/route-pages/catalog.html"
  status = 200

[[redirects]]
  from = "/btech-cse-projects"
  to = "/route-pages/btech.html"
  status = 200

[[redirects]]
  from = "/mtech-cse-projects"
  to = "/route-pages/mtech.html"
  status = 200

[[redirects]]
  from = "/phd-research-guidance"
  to = "/route-pages/phd.html"
  status = 200

[[redirects]]
  from = "/inquire"
  to = "/route-pages/inquire.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/route-pages/contact.html"
  status = 200

# The rest of the app's routes. Keep in sync with src/App.jsx.
[[redirects]]
  from = "/auth"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# Anything else is a page that doesn't exist: show the app's "Page not
# found" screen with a real 404 status, so Google doesn't index it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# Security headers for every static page and asset. The project-preview
# function sets the same headers on its own responses; keep the two in sync.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.googleadservices.com https://googleads.g.doubleclick.net https://www.google.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com https://www.google.co.in https://googleads.g.doubleclick.net https://www.googleadservices.com https://pagead2.googlesyndication.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://www.google.com https://maps.google.com https://www.googletagmanager.com https://td.doubleclick.net; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets never change, so browsers can cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

